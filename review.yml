actions:
  apisYmlCreated: true
  readmeCreated: true
  openapiHarvested: false
  specsCount: 0
  apisListed: 3
  fabricated: none
  omissions: >-
    The Canadian Centre for Energy Information and its .Stat Suite explorer are Statistics Canada
    properties and are not attributed to the CER. Ontario's Green Button implementations belong to the
    Ontario utility and OEB profiles, not to this federal regulator, and no Ontario utility endpoint was
    probed here. The undocumented BERDI GraphQL backend is recorded in the probe log but is deliberately
    not listed as an API because it is neither documented nor anonymously reachable.
