source: live probes 2026-07-27
note: The Canada Energy Regulator publishes no API lifecycle policy of any kind — no versioning statement, no deprecation
  policy, no sunset commitment, no SLA and no status page. Nothing below is a policy the CER has stated; it is the
  version surface each upstream product happens to expose, plus the dataset update cadences the CER declares in its
  own CKAN metadata, which are the closest thing to a published freshness commitment it makes.
versioning:
  policy_published: false
  scheme: per upstream product, not CER-controlled
  surfaces:
  - surface: CER ArcGIS Online feature services
    version: currentVersion 12
    scheme: vendor build number in the service descriptor
  - surface: CER Assessments MapServer (Federal Geospatial Platform)
    version: currentVersion 10.81
    scheme: vendor build number
  - surface: OGC WMS
    version: 1.3.0
    scheme: required version= query parameter
  - surface: Open Government Portal CKAN
    version: v3
    scheme: URI path — /data/api/3/action
deprecation:
  policy_url: null
  policy_published: false
  sunset_header: false
  deprecation_header: false
  note: No RFC 8594 Sunset or Deprecation header was observed and no deprecation policy page exists. Layer names carry
    the de facto versioning instead — Incident_Data_English_20191007_View pins a 2019-10-07 extract, and CER_Pipeline_Systems_WGS84_view
    sits beside CER_Pipeline_Systems_WGS84_WM_v with the same 28 features in a different projection. Nothing tells
    a client which is canonical or when either retires.
