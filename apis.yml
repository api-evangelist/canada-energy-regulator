- aid: canada-energy-regulator:cer-assessments-map-service
  name: CER Assessments Map Service (Federal Geospatial Platform)
  description: >-
    The CER's Environmental and Socio-economic Assessments (ESA) layer, published through the Government
    of Canada's Federal Geospatial Platform at maps-cartes.services.geo.ca under the NRCan folder and
    served in English and French. Two protocols are exposed for the same data and both answered
    anonymously on 2026-07-27: an Esri ArcGIS REST MapServer (?f=json returned a service description
    naming the CER as the data owner) and an OGC WMS 1.3.0 endpoint whose GetCapabilities document
    parsed as valid XML. This is CER data on federal shared infrastructure rather than a CER-operated
    host, and it is the only place in this review where an open, vendor-neutral international standard
    (OGC WMS) is used.
  humanURL: https://open.canada.ca/data/en/dataset/039fbd92-43c2-4805-b210-d65703712e37
  baseURL: https://maps-cartes.services.geo.ca/server_serveur/rest/services/NRCan/CER_Assessments_EN/MapServer
