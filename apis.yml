aid: canada-energy-regulator
url: https://raw.githubusercontent.com/api-evangelist/canada-energy-regulator/refs/heads/main/apis.yml
name: Canada Energy Regulator
kind: company
description: >-
  The Canada Energy Regulator (CER / Régie de l'énergie du Canada) is Canada's federal energy regulator,
  created by the Canadian Energy Regulator Act in 2019 to replace the National Energy Board. Its remit is
  the interprovincial and international layer of the energy system: pipelines and power lines that cross a
  provincial or national border, imports and exports of oil, natural gas, NGLs, LNG and electricity, oil
  and gas activity on frontier and offshore lands, and offshore renewable energy projects. It does not
  regulate the distribution utilities that meter and bill Canadian households — electricity and gas
  distribution is provincial, which is why the only consumer energy data mandate in the country, Ontario's
  Green Button regulation O. Reg. 633/21, is administered by the Ontario Energy Board and not by the CER.
  The CER's API posture is the cleanest possible statement of that split: it is genuinely open on market
  and system data and entirely absent on consumer data. It publishes 83 datasets and 944 resources on the
  Government of Canada Open Government Portal, every one of them under the Open Government Licence –
  Canada, 894 of them CSV files served anonymously from its own www.cer-rec.gc.ca/open/ tree, all of it
  queryable without a key through the portal's CKAN Action API. It operates its own ArcGIS Online
  organization whose 23 hosted feature services — pipeline systems, incidents, provincial pipeline status,
  resource areas, refineries — answered anonymous ArcGIS REST queries on 2026-07-27, and it publishes an
  Environmental and Socio-economic Assessments layer through the Federal Geospatial Platform as both an
  Esri ArcGIS REST MapServer and an OGC WMS 1.3.0 service. It also open-sources the front ends for its own
  visualizations on GitHub. What it does not have is a developer portal, an OpenAPI definition, an API key,
  a rate-limit policy, or a single machine-readable path to an individual customer's usage or billing data.
  No mandate obliges it to have one. Home market Canada.
image: https://www.cer-rec.gc.ca/global/images/logo_cer_en.png
