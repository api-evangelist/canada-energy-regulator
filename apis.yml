apis:
- aid: canada-energy-regulator:cer-arcgis-feature-services
  name: CER ArcGIS Online Feature Services
  description: >-
    The Canada Energy Regulator operates its own ArcGIS Online organization (portal
    neb-gis.maps.arcgis.com, organization id vNzamREXvX2WcX6d) and hosts 23 public feature services on
    it. This is the one genuinely CER-operated machine-readable API surface found in this review. The
    services directory, every FeatureServer descriptor and the /query operation all answered anonymous
    HTTPS requests on 2026-07-27 with no key, no signup and no terms click-through. Layers include
    CER_Pipeline_Systems_WGS84_view, Incident_Data_English_20191007_View (1,899 features confirmed by
    a returnCountOnly query), Prov_Pipe_Status (43 features), Prov_Pipe_Type, Oil_and_Gas_Resource_Area,
    Refinery, Western_Canada_Sedimentary_Basin, Pipelines_Profile_Links_EN_view and both English and
    French incident layers. The contract is Esri's ArcGIS REST API, not OpenAPI; no OpenAPI, Swagger or
    /api-docs document is published for it. This service backs the public CER Interactive Pipeline Map.
  humanURL: https://www.cer-rec.gc.ca/en/safety-environment/industry-performance/interactive-pipeline/index.html
  baseURL: https://services5.arcgis.com/vNzamREXvX2WcX6d/arcgis/rest/services
