- aid: canada-energy-regulator:cer-open-data-ckan
  name: CER Open Data via the Open Government Portal CKAN API
  description: >-
    The Canada Energy Regulator publishes no API of its own for tabular data, but all of its open data is
    machine-readable through the Government of Canada Open Government Portal's CKAN Action API, which is
    operated by the Treasury Board of Canada Secretariat and not by the CER. Filtering that API to the
    CER's organization id A3EE9522-882F-47B0-BA7D-83420DC8577C returned 83 datasets carrying 944
    resources on 2026-07-27 — 894 CSV, 36 HTML, 8 PDF, 2 XLSX, 2 Esri REST and 2 WMS — every one licensed
    under the Open Government Licence – Canada. Coverage is the CER's regulatory and market record:
    crude oil, natural gas, NGL, LNG and electricity imports and exports, pipeline throughput, capacity
    and tolls, pipeline financial information, incidents, conditions, compliance and enforcement, the
    regulated company list, frontier production statistics and the Canada's Energy Future projection
    series. Only one of the 944 resources is loaded into the CKAN datastore, so datastore_search row-level
    querying is effectively unavailable; the real access pattern is metadata over the API and then bulk
    CSV download from https://www.cer-rec.gc.ca/open/, which was confirmed serving a 10,110-byte LNG
    exports file anonymously.
  humanURL: https://open.canada.ca/data/en/organization/cer-rec
  baseURL: https://open.canada.ca/data/api/3/action
