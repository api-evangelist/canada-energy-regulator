observations:
- Field names in several layers are truncated to 10 characters (Incident_N, Reported_D, What_Happe, Why_It_Hap) —
  the schema still carries shapefile-era constraints.
- 'Bilingualism is modelled three different ways in one estate: paired columns (name_en/name_fr), suffixed columns
  (Pipeline_Name_FRA) and wholly separate services with translated field names (Incident_Data_French).'
- Four of the 23 services are test, temporary, empty or duplicate and are published anonymously with no status marker.
